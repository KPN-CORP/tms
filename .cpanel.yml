---
# Single deploy config for the kpn-pm app, shared by production and staging.
# The target is chosen by the repository folder it runs in, so this file is
# IDENTICAL on every branch — no per-environment edits, no merge conflicts.
#
#   repo folder tms        -> PRODUCTION  (branch: master)
#   repo folder tms-stage  -> STAGING     (branch: development)
#
# Do NOT edit this file on the server. Change it locally, commit, push, deploy.

deployment:
  tasks:
    - |
      set -e
      REPO="$(basename "$(pwd)")"
      case "$REPO" in
        tms)                             # PRODUCTION
          DEPLOYPATH=/home/hcispanel/tms
          PUBHTML=/home/hcispanel/public_html/tms.hcis.live
          ;;
        tms-stage)                       # STAGING
          DEPLOYPATH=/home/hcispanel/tms-stage
          PUBHTML=/home/hcispanel/public_html/tms-staging.hcis.live
          ;;
        *)
          echo "Unknown repo folder: $REPO — refusing to deploy"; exit 1
          ;;
      esac

      # Ensure deployment + asset folders exist
      mkdir -p "$DEPLOYPATH"/public/{build,css,img,images,js,scss}
      mkdir -p "$DEPLOYPATH"/storage "$DEPLOYPATH"/bootstrap/cache
      mkdir -p "$PUBHTML"/{build,css,img,images,js,scss}

      LOG="$DEPLOYPATH/deploy.log"
      exec >> "$LOG" 2>&1
      echo "===== Deploy $REPO -> $DEPLOYPATH  (assets: $PUBHTML)  $(date) ====="

      echo "Sync application code (only changed files)"
      rsync -a --delete \
        app bootstrap config database routes resources \
        artisan composer.json composer.lock package.json package-lock.json \
        "$DEPLOYPATH"/

      echo "Sync public assets into the live app directory"
      rsync -a public/build public/css public/img public/images public/js public/scss \
        "$DEPLOYPATH"/public/

      echo "Change to deployment directory"
      cd "$DEPLOYPATH"

      echo "Install composer dependencies (only if lock changed)"
      if [ ! -d vendor ] || ! cmp -s composer.lock vendor/composer.lock.deployed 2>/dev/null; then
        php -d memory_limit=-1 /opt/cpanel/composer/bin/composer install \
          --no-dev --no-interaction --prefer-dist --optimize-autoloader
        cp composer.lock vendor/composer.lock.deployed
      else
        echo "composer.lock unchanged — skipping install"
      fi

      # echo "Install Node packages + build"
      # npm ci --legacy-peer-deps --no-audit --silent
      # npm run build

      echo "Set correct permissions"
      chmod -R 755 storage bootstrap/cache

      echo "Rebuild Laravel caches (faster than clearing)"
      php artisan optimize:clear || true
      php artisan config:cache || true
      php artisan route:cache || true
      php artisan view:cache || true

      echo "Sync public assets into the site document root"
      rsync -a public/build public/css public/img public/images public/js public/scss \
        "$PUBHTML"/

      echo "===== Done $(date) ====="
      